name: Test and Build

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Generate mocks
        run: go run github.com/vektra/mockery/v2@v2.53.5 --config /dev/null --all --recursive --inpackage --case underscore --with-expecter=true
      - name: Run tests
        run: go test -cover -race ./...
      - name: Build
        run: go build -o zesh .
